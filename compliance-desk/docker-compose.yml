version: "3.8"

services:
  # Database Service: PostgreSQL 15
  db:
    image: postgres:15-alpine
    container_name: compliance_desk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compliance_desk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d compliance_desk"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/compliance_desk"
    depends_on:
      db:
        condition: service_healthy

  # Application Service: Next.js Frontend & API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compliance_desk_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/compliance_desk"
      NEXTAUTH_URL: "http://localhost:3000"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      LLM_PRIMARY_PROVIDER: "groq"
      LLM_FALLBACK_PROVIDER: "gemini"
      UPLOAD_DIR: "./uploads"
      NODE_ENV: "production"
      STORAGE_DRIVER: "local"
      ALLOW_LOCAL_STORAGE: "true"
      ALLOW_HTTP: "true"
      AWS_REGION: "${AWS_REGION:-ap-south-1}"
      EMAIL_FROM: "${EMAIL_FROM:-local@example.invalid}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}"
    ports:
      - "3000:3000"
    volumes:
      - app_uploads:/app/uploads

volumes:
  pgdata:
    driver: local
  app_uploads:
    driver: local
