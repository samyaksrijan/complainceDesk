name: Deploy to existing ECS service
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: compliance-desk/package-lock.json
      - run: npm ci && npx prisma generate && npm run lint && npm run typecheck && npm test && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: compliance-desk
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: compliance-desk
          target: runner
          platforms: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: compliance-desk
          target: migrate
          platforms: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}-migrate
      - name: Register migration revision and apply additive migrations
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}-migrate
          MIGRATION_FAMILY: ${{ vars.ECS_MIGRATION_FAMILY }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$MIGRATION_FAMILY" --query taskDefinition > migration-current.json
          jq --arg image "$IMAGE" 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) | .containerDefinitions[0].image=$image' migration-current.json > migration-next.json
          REVISION=$(aws ecs register-task-definition --cli-input-json file://migration-next.json --query taskDefinition.taskDefinitionArn --output text)
          TASK=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type EC2 --task-definition "$REVISION" --query 'tasks[0].taskArn' --output text)
          test "$TASK" != None
          MIGRATION_FINISHED=false
          trap 'if [ "$MIGRATION_FINISHED" != true ]; then aws ecs stop-task --cluster "$ECS_CLUSTER" --task "$TASK" --reason "Deployment verification interrupted" >/dev/null || true; fi' EXIT
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK"
          EXIT=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          MIGRATION_FINISHED=true
          test "$EXIT" = 0
      - name: Update service and wait for health
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          CURRENT=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$CURRENT" --query taskDefinition > app-current.json
          jq --arg image "$IMAGE" 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) | .containerDefinitions[0].image=$image' app-current.json > app-next.json
          NEXT=$(aws ecs register-task-definition --cli-input-json file://app-next.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEXT" --deployment-configuration 'minimumHealthyPercent=0,maximumPercent=100,deploymentCircuitBreaker={enable=true,rollback=true}' > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          ACTIVE=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          test "$ACTIVE" = "$NEXT"
